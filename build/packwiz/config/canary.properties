# This is the configuration file for Canary.
# This file exists for debugging purposes and should not be configured otherwise.
# Before configuring anything, take a backup of the worlds that will be opened.
#
# You can find information on editing this file and all the available options here:
# https://github.com/AbdElAziz333/Canary/wiki/Configuration-File
#
# By default, this file will be empty except for this notice.

# 2026-09-06: Canary's collision optimisation (CanaryEntityCollisions / ChunkAwareBlockCollisionSweeper) calls
# getChunkBlocking on the server thread. Vanilla treats an unloaded chunk as empty; Canary demands it. In the
# expanded desert city, where chunks still need their heightmaps and light computed, that blocking call never
# returns and the watchdog kills the tick. Every crash report named Canary. Disabled until the area is baked.
mixin.entity.collisions=false
